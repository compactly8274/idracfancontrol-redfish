services:
  fancontrol:
    image: ghcr.io/compactly8274/idracfancontrol-redfish:latest
    restart: unless-stopped
    environment:
      IDRAC_HOST: 192.168.1.115
      IDRAC_USER: phil
      IDRAC_PASS: ""              # set your password here or use a .env file
      POLL_INTERVAL: "30"
      WARN_TEMP: "70"
      CRITICAL_TEMP: "85"
      GPU_MONITORING: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
networks: {}
